<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Architecture Visualizer </title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        dark: {
                            900: '#050507',
                            800: '#0f1116',
                            700: '#1a1d26',
                        },
                        brand: {
                            accent: '#6366f1', // Indigo
                            glow: '#818cf8',
                        }
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'flow': 'flow 1.5s linear infinite',
                    },
                    keyframes: {
                        flow: {
                            '0%': { strokeDashoffset: '20' },
                            '100%': { strokeDashoffset: '0' }
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #050507; color: #e2e8f0; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0f1116; 
        }
        ::-webkit-scrollbar-thumb {
            background: #374151; 
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #4b5563; 
        }

        .glass-panel {
            background: rgba(15, 17, 22, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .node-glow {
            filter: drop-shadow(0 0 8px rgba(99, 102, 241, 0.5));
        }
        
        /* Animated Dashed Lines */
        .path-active {
            stroke-dasharray: 5;
            animation: dash 1s linear infinite;
        }
        
        @keyframes dash {
            to {
                stroke-dashoffset: -10;
            }
        }
        
        .packet {
            offset-path: path(var(--path-d));
            animation: movePacket 1.5s linear infinite;
            opacity: 0;
        }
        
        @keyframes movePacket {
            0% { offset-distance: 0%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { offset-distance: 100%; opacity: 0; }
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col">

    <div id="root" class="h-full w-full flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // --- Icons ---
        const Icon = ({ d, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {d}
            </svg>
        );

        const Icons = {
            Brain: (p) => <Icon {...p} d={<><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2Z"/><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.98-3A2.5 2.5 0 0 0 14.5 2Z"/></>} />,
            Terminal: (p) => <Icon {...p} d={<><polyline points="4 17 10 11 4 5" /><line x1="12" y1="19" x2="20" y2="19" /></>} />,
            Cpu: (p) => <Icon {...p} d={<><rect x="4" y="4" width="16" height="16" rx="2" /><rect x="9" y="9" width="6" height="6" /><path d="M9 1v3"/><path d="M15 1v3"/><path d="M9 20v3"/><path d="M15 20v3"/><path d="M20 9h3"/><path d="M20 14h3"/><path d="M1 9h3"/><path d="M1 14h3"/></>} />,
            Network: (p) => <Icon {...p} d={<><rect x="16" y="16" width="6" height="6" rx="1"/><rect x="2" y="16" width="6" height="6" rx="1"/><rect x="9" y="2" width="6" height="6" rx="1"/><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"/><path d="M12 12V8"/></>} />,
            Zap: (p) => <Icon {...p} d={<><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></>} />,
            Play: (p) => <Icon {...p} d={<><polygon points="5 3 19 12 5 21 5 3"/></>} />,
            Refresh: (p) => <Icon {...p} d={<><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></>} />,
            Layers: (p) => <Icon {...p} d={<><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></>} />,
            Box: (p) => <Icon {...p} d={<><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></>} />,
            BarChart: (p) => <Icon {...p} d={<><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></>} />
        };

        // --- Constants & Data ---
        const STEPS = [
            { id: 'token', title: 'Tokenization', icon: Icons.Box, desc: 'Input string → Integer IDs', color: 'text-blue-400' },
            { id: 'embed', title: 'Embedding', icon: Icons.Layers, desc: 'ID → Dense Vector', color: 'text-purple-400' },
            { id: 'attn', title: 'Attention', icon: Icons.Network, desc: 'Context Mixing (Q,K,V)', color: 'text-yellow-400' },
            { id: 'ffn', title: 'Feed Forward', icon: Icons.Cpu, desc: 'Processing & reasoning', color: 'text-green-400' },
            { id: 'logit', title: 'Logits', icon: Icons.BarChart, desc: 'Vector → Probabilities', color: 'text-red-400' }
        ];

        const VOCAB = {
            "hi": { id: 5301, next: ["there", "friend", "world"], type: "greeting" },
            "hello": { id: 15496, next: ["world", "everyone", "assistant"], type: "greeting" },
            "who": { id: 892, next: ["is", "are", "was"], type: "question" },
            "the": { id: 464, next: ["cat", "future", "model"], type: "article" },
            "artificial": { id: 1298, next: ["intelligence", "neural", "flowers"], type: "adjective" },
            "open": { id: 332, next: ["source", "door", "ai"], type: "verb/adj" },
            "code": { id: 991, next: ["is", "generation", "interpreter"], type: "noun" },
            "gpt": { id: 1337, next: ["is", "model", "rocks"], type: "noun" },
            "react": { id: 2024, next: ["component", "hook", "library"], type: "noun" },
            "default": { id: 0, next: ["...", "???", "data"], type: "unknown" }
        };

        // --- Visualization Sub-Components ---

        // Renders a connection line with optional "data packet" animation
        const ConnectionPath = ({ start, end, active, color }) => {
            const pathD = `M ${start.x} ${start.y} C ${(start.x + end.x) / 2} ${start.y}, ${(start.x + end.x) / 2} ${end.y}, ${end.x} ${end.y}`;
            
            return (
                <g>
                    {/* Base Path */}
                    <path d={pathD} stroke="#1f2937" strokeWidth="1" fill="none" />
                    
                    {/* Active Glow Path */}
                    <path 
                        d={pathD} 
                        stroke={active ? color : "transparent"} 
                        strokeWidth="1.5" 
                        fill="none" 
                        className={`transition-all duration-500 ${active ? 'opacity-60' : 'opacity-0'}`}
                    />

                    {/* Moving Data Packet */}
                    {active && (
                        <circle r="3" fill="white" className="packet" style={{ '--path-d': `"${pathD}"` }}>
                             <animate attributeName="opacity" values="0;1;0" dur="1.5s" repeatCount="indefinite" />
                        </circle>
                    )}
                </g>
            );
        };

        // --- Main Component ---
        function App() {
            const [input, setInput] = useState('');
            const [isRunning, setIsRunning] = useState(false);
            const [step, setStep] = useState(-1);
            const [logs, setLogs] = useState([]);
            const [result, setResult] = useState(null);
            
            const logEndRef = useRef(null);

            // Auto-scroll logs
            useEffect(() => {
                logEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [logs]);

            const addLog = (text, type = 'info') => {
                setLogs(prev => [...prev, { text, type, time: new Date().toLocaleTimeString([], { hour12: false, hour: "2-digit", minute: "2-digit", second: "2-digit" }) }]);
            };

            const runSimulation = () => {
                if (!input.trim() || isRunning) return;
                
                setIsRunning(true);
                setStep(0);
                setResult(null);
                setLogs([]);

                const token = input.toLowerCase().trim().split(' ')[0]; // Simple single word tokenization
                const vocabEntry = VOCAB[token] || VOCAB["default"];
                
                const sequence = [
                    { s: 0, delay: 500, log: `Tokenizing "${input}" → ID [${vocabEntry.id}]` },
                    { s: 1, delay: 2000, log: `Embedding ID ${vocabEntry.id} into 768-dim vector space...` },
                    { s: 2, delay: 3500, log: `Attention heads attending to context window...` },
                    { s: 3, delay: 5000, log: `Feed-forward network activating neurons (GeLU)...` },
                    { s: 4, delay: 6500, log: `Calculating logits & softmax probabilities...` }
                ];

                let totalDelay = 0;
                sequence.forEach((seq, idx) => {
                    setTimeout(() => {
                        setStep(seq.s);
                        addLog(seq.log, 'process');
                        
                        // Final Step
                        if (idx === sequence.length - 1) {
                            setTimeout(() => {
                                const s1 = Math.floor(Math.random() * 15) + 70;
                                const s2 = Math.floor((100 - s1) * 0.7);
                                const s3 = 100 - s1 - s2;
                                
                                setResult([
                                    { word: vocabEntry.next[0], score: s1 },
                                    { word: vocabEntry.next[1], score: s2 },
                                    { word: vocabEntry.next[2], score: s3 }
                                ]);
                                setIsRunning(false);
                                addLog(`Prediction complete: "${vocabEntry.next[0]}"`, 'success');
                            }, 1500);
                        }
                    }, seq.delay);
                });
            };

            const handleReset = () => {
                setStep(-1);
                setResult(null);
                setLogs([]);
                setIsRunning(false);
                setInput('');
            };

            return (
                <div className="flex flex-col h-full bg-dark-900 text-gray-200 font-sans selection:bg-brand-accent selection:text-white">
                    
                    {/* Navbar */}
                    <nav className="h-16 border-b border-gray-800 bg-dark-800/50 backdrop-blur flex items-center px-6 justify-between shrink-0 z-10">
                        <div className="flex items-center gap-3">
                            <div className="w-8 h-8 bg-brand-accent/20 rounded-lg flex items-center justify-center border border-brand-accent/50">
                                <Icons.Brain className="w-5 h-5 text-brand-accent" />
                            </div>
                            <div>
                                <h1 className="font-bold text-lg tracking-tight text-white">Neuraviz <span className="text-brand-accent">.ai</span></h1>
                                <p className="text-[10px] text-gray-500 uppercase tracking-wider font-mono">Architecture Explorer</p>
                            </div>
                        </div>
                        <div className="hidden md:flex items-center gap-4 text-xs font-mono text-gray-500">
                            <span>Model: GPT-Nano</span>
                            <span>Params: 12M</span>
                        </div>
                    </nav>

                    {/* Main Content Grid */}
                    <main className="flex-1 overflow-hidden grid grid-cols-1 lg:grid-cols-12 gap-0 lg:gap-0 relative">
                        
                        {/* LEFT PANEL: Controls & Logic */}
                        <aside className="lg:col-span-3 bg-dark-800 border-r border-gray-800 flex flex-col overflow-hidden relative z-10">
                            
                            {/* Input Section */}
                            <div className="p-5 border-b border-gray-800 bg-dark-800/90">
                                <label className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2 block">Input Prompt</label>
                                <div className="flex gap-2">
                                    <input 
                                        type="text" 
                                        value={input}
                                        onChange={(e) => setInput(e.target.value)}
                                        onKeyDown={(e) => e.key === 'Enter' && runSimulation()}
                                        placeholder="Try 'hello', 'who', 'code'..."
                                        className="flex-1 bg-dark-900 border border-gray-700 rounded-md px-3 py-2 text-sm focus:border-brand-accent focus:ring-1 focus:ring-brand-accent outline-none transition-all font-mono"
                                        disabled={isRunning}
                                    />
                                    <button 
                                        onClick={runSimulation}
                                        disabled={!input || isRunning}
                                        className={`p-2 rounded-md transition-all ${isRunning ? 'bg-gray-800 text-gray-500' : 'bg-brand-accent hover:bg-brand-glow text-white shadow-lg shadow-brand-accent/20'}`}
                                    >
                                        {isRunning ? <Icons.Refresh className="w-5 h-5 animate-spin"/> : <Icons.Play className="w-5 h-5 fill-current"/>}
                                    </button>
                                </div>
                                {result && (
                                    <button onClick={handleReset} className="mt-3 text-xs text-red-400 hover:text-red-300 flex items-center gap-1 ml-auto">
                                        <Icons.Refresh className="w-3 h-3" /> Reset
                                    </button>
                                )}
                            </div>

                            {/* Steps List */}
                            <div className="flex-1 overflow-y-auto p-4 space-y-3 custom-scrollbar">
                                <div className="text-xs font-bold text-gray-500 uppercase tracking-wider mb-1 px-1">Pipeline Stages</div>
                                {STEPS.map((s, i) => {
                                    const isActive = step === i;
                                    const isPast = step > i;
                                    return (
                                        <div 
                                            key={s.id} 
                                            className={`relative p-3 rounded-lg border transition-all duration-300 group
                                                ${isActive ? 'bg-brand-accent/10 border-brand-accent/50 shadow-[0_0_15px_rgba(99,102,241,0.1)]' : 
                                                  isPast ? 'bg-dark-900/50 border-gray-800 opacity-50' : 'bg-transparent border-transparent opacity-40'}`}
                                        >
                                            <div className="flex items-center gap-3">
                                                <div className={`p-2 rounded-md ${isActive ? 'bg-brand-accent text-white' : 'bg-gray-800 text-gray-400'}`}>
                                                    <s.icon className="w-4 h-4" />
                                                </div>
                                                <div>
                                                    <div className={`text-sm font-semibold ${isActive ? 'text-white' : 'text-gray-300'}`}>{s.title}</div>
                                                    <div className="text-[11px] text-gray-500 font-mono">{s.desc}</div>
                                                </div>
                                                {isActive && <div className="ml-auto w-2 h-2 rounded-full bg-brand-accent animate-pulse shadow-[0_0_8px_#6366f1]"></div>}
                                            </div>
                                        </div>
                                    )
                                })}
                            </div>

                            {/* Terminal/Logs */}
                            <div className="h-1/3 min-h-[200px] bg-black border-t border-gray-800 p-4 font-mono text-xs overflow-hidden flex flex-col">
                                <div className="flex items-center gap-2 text-gray-500 mb-2 border-b border-gray-900 pb-2">
                                    <Icons.Terminal className="w-3 h-3" />
                                    <span>system_logs</span>
                                </div>
                                <div className="flex-1 overflow-y-auto custom-scrollbar space-y-1.5">
                                    {!logs.length && <span className="text-gray-700 italic">Ready for input...</span>}
                                    {logs.map((log, idx) => (
                                        <div key={idx} className="flex gap-2 animate-in fade-in slide-in-from-bottom-2 duration-300">
                                            <span className="text-gray-600">[{log.time}]</span>
                                            <span className={log.type === 'success' ? 'text-green-400' : log.type === 'process' ? 'text-blue-400' : 'text-gray-300'}>
                                                {log.text}
                                            </span>
                                        </div>
                                    ))}
                                    <div ref={logEndRef} />
                                </div>
                            </div>
                        </aside>

                        /* RIGHT PANEL: Visualizer */}
                        <section className="lg:col-span-9 relative bg-[#050507] flex flex-col overflow-hidden">
                            
                            {/* Grid Background */}
                            <div className="absolute inset-0 pointer-events-none" style={{
                                backgroundImage: 'radial-gradient(#1f2937 1px, transparent 1px)',
                                backgroundSize: '30px 30px',
                                opacity: 0.2
                            }}></div>

                            {/* Output Overlay */}
                            {result && (
                                <div className="absolute top-6 right-6 z-50 animate-in fade-in zoom-in duration-500">
                                    <div className="glass-panel p-5 rounded-xl shadow-2xl min-w-[240px] border-t-2 border-t-green-500">
                                        <div className="flex items-center justify-between mb-4">
                                            <h3 className="text-sm font-bold text-white">Next Token Probability</h3>
                                            <div className="px-2 py-0.5 bg-green-500/20 text-green-400 text-[10px] rounded font-mono uppercase">Top 3</div>
                                        </div>
                                        <div className="space-y-3">
                                            {result.map((item, i) => (
                                                <div key={i} className="space-y-1">
                                                    <div className="flex justify-between text-xs">
                                                        <span className="font-mono text-gray-300">"{item.word}"</span>
                                                        <span className="text-gray-500">{item.score}%</span>
                                                    </div>
                                                    <div className="h-1.5 bg-gray-800 rounded-full overflow-hidden">
                                                        <div 
                                                            className="h-full bg-gradient-to-r from-brand-accent to-purple-500 rounded-full" 
                                                            style={{ width: `${item.score}%`, transition: 'width 1s ease-out' }}
                                                        ></div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* Main Diagram Container */}
                            <div className="flex-1 overflow-auto flex items-center justify-center relative custom-scrollbar p-10">
                                <div className="relative min-w-[800px] h-[500px] select-none">
                                    
                                    {/* SVG Layer for Lines */}
                                    <svg className="absolute inset-0 w-full h-full pointer-events-none overflow-visible">
                                        {/* Lines calculated manually for simplicity in this standalone file */}
                                        {/* Input to Embed */}
                                        <ConnectionPath start={{x:100,y:250}} end={{x:250,y:150}} active={step >= 1} color="#a855f7" />
                                        <ConnectionPath start={{x:100,y:250}} end={{x:250,y:250}} active={step >= 1} color="#a855f7" />
                                        <ConnectionPath start={{x:100,y:250}} end={{x:250,y:350}} active={step >= 1} color="#a855f7" />

                                        {/* Embed to Attention */}
                                        <ConnectionPath start={{x:290,y:150}} end={{x:450,y:200}} active={step >= 2} color="#eab308" />
                                        <ConnectionPath start={{x:290,y:250}} end={{x:450,y:250}} active={step >= 2} color="#eab308" />
                                        <ConnectionPath start={{x:290,y:350}} end={{x:450,y:300}} active={step >= 2} color="#eab308" />

                                        {/* Attention to FFN */}
                                        <ConnectionPath start={{x:490,y:200}} end={{x:650,y:250}} active={step >= 3} color="#22c55e" />
                                        <ConnectionPath start={{x:490,y:250}} end={{x:650,y:250}} active={step >= 3} color="#22c55e" />
                                        <ConnectionPath start={{x:490,y:300}} end={{x:650,y:250}} active={step >= 3} color="#22c55e" />

                                        {/* FFN to Logits */}
                                        <ConnectionPath start={{x:690,y:250}} end={{x:850,y:200}} active={step >= 4} color="#ef4444" />
                                        <ConnectionPath start={{x:690,y:250}} end={{x:850,y:250}} active={step >= 4} color="#ef4444" />
                                        <ConnectionPath start={{x:690,y:250}} end={{x:850,y:300}} active={step >= 4} color="#ef4444" />
                                    </svg>

                                    {/* Nodes Layer */}
                                    
                                    {/* 1. Input Token */}
                                    <div className="absolute left-[40px] top-[230px]">
                                        <div className={`w-12 h-12 rounded-lg border border-gray-700 bg-dark-800 flex items-center justify-center shadow-xl transition-all duration-500 ${step >= 0 ? 'border-blue-500 shadow-blue-900/50 scale-110' : ''}`}>
                                            <span className="text-xs font-mono text-blue-300">{input ? 'ID' : '?'}</span>
                                        </div>
                                        <div className="absolute -bottom-6 left-0 w-full text-center text-[10px] text-gray-500 uppercase font-bold">Token</div>
                                    </div>

                                    {/* 2. Embedding Layer */}
                                    <div className="absolute left-[250px] top-[100px] flex flex-col gap-4">
                                        {[0,1,2].map(i => (
                                            <div key={i} className={`w-10 h-16 rounded bg-gray-800/50 border border-gray-700 transition-all duration-300 ${step === 1 ? 'border-purple-500 bg-purple-900/20 shadow-[0_0_15px_rgba(168,85,247,0.3)]' : ''}`}></div>
                                        ))}
                                        <div className="absolute -bottom-8 left-0 w-full text-center text-[10px] text-purple-400 uppercase font-bold tracking-wider">Embed</div>
                                    </div>

                                    {/* 3. Attention Layer */}
                                    <div className="absolute left-[450px] top-[180px] flex flex-col gap-2">
                                        {[0,1,2].map(i => (
                                            <div key={i} className={`w-12 h-12 rounded-full bg-dark-800 border border-gray-700 flex items-center justify-center transition-all duration-500 ${step === 2 ? 'border-yellow-500 scale-110 shadow-[0_0_15px_rgba(234,179,8,0.3)]' : ''}`}>
                                                <span className="text-[10px] font-mono text-gray-500">H{i+1}</span>
                                            </div>
                                        ))}
                                         <div className="absolute -bottom-10 left-0 w-full text-center text-[10px] text-yellow-500 uppercase font-bold tracking-wider">Attn</div>
                                    </div>

                                    {/* 4. Feed Forward */}
                                    <div className="absolute left-[650px] top-[210px]">
                                        <div className={`w-16 h-20 bg-dark-800 border border-gray-700 rounded-lg flex items-center justify-center relative transition-all duration-500 ${step === 3 ? 'border-green-500 shadow-[0_0_20px_rgba(34,197,94,0.3)]' : ''}`}>
                                            <div className="grid grid-cols-2 gap-2">
                                                {[0,1,2,3].map(i => <div key={i} className={`w-2 h-2 rounded-full ${step === 3 ? 'bg-green-400 animate-ping' : 'bg-gray-700'}`}></div>)}
                                            </div>
                                        </div>
                                        <div className="absolute -bottom-8 left-0 w-full text-center text-[10px] text-green-500 uppercase font-bold tracking-wider">FFN</div>
                                    </div>

                                    {/* 5. Logits */}
                                    <div className="absolute left-[850px] top-[180px] flex flex-col gap-3">
                                        {[0,1,2].map(i => (
                                            <div key={i} className="flex items-center gap-2">
                                                <div className={`h-3 rounded-r transition-all duration-1000 ${step === 4 ? 'bg-red-500 w-16 shadow-[0_0_10px_#ef4444]' : 'bg-gray-800 w-6'}`}></div>
                                            </div>
                                        ))}
                                        <div className="absolute -bottom-10 left-0 w-full text-center text-[10px] text-red-500 uppercase font-bold tracking-wider">Logits</div>
                                    </div>

                                </div>
                            </div>
                            
                            {/* Info Footer */}
                            <div className="p-2 border-t border-gray-800 bg-dark-900 flex justify-between items-center text-[10px] text-gray-600 px-6">
                                <span>Visualization logic simplified for demonstration</span>
                                <span>v2.1.0</span>
                            </div>
                        </section>

                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
