<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RNN "Memory" Visualizer</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #09090b; color: #e4e4e7; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }

        /* Smooth transitions for layout changes */
        .smooth-move { transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
        
        /* Data flow animations */
        @keyframes flow-h { 
            0% { transform: translateX(-100%); opacity: 0; } 
            50% { opacity: 1; }
            100% { transform: translateX(100%); opacity: 0; } 
        }
        @keyframes flow-v { 
            0% { transform: translateY(100%); opacity: 0; } 
            50% { opacity: 1; }
            100% { transform: translateY(-100%); opacity: 0; } 
        }
        
        .animate-flow-h { animation: flow-h 1s linear infinite; }
        .animate-flow-v { animation: flow-v 1s linear infinite; }

        .glass-panel {
            background: rgba(24, 24, 27, 0.8);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // --- Icons ---
        const Icon = ({ name, size = 20, className }) => {
            const icons = {
                play: <polygon points="5 3 19 12 5 21 5 3" />,
                pause: <g><rect x="6" y="4" width="4" height="16" /><rect x="14" y="4" width="4" height="16" /></g>,
                refresh: <path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" />,
                step: <path d="M5 4l10 8-10 8V4zM19 5v14" />,
                brain: <path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2Z M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.98-3A2.5 2.5 0 0 0 14.5 2Z" />,
                zap: <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />
            };
            return (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {icons[name]}
                </svg>
            );
        };

        // --- Mock Word Embeddings ---
        // Simplified 3D vectors for visualization
        const VOCAB = {
            "i": { vec: [0.1, 0.1, 0.1], type: "neutral" },
            "love": { vec: [0.8, 0.9, 0.2], type: "positive" },
            "like": { vec: [0.6, 0.7, 0.2], type: "positive" },
            "hate": { vec: [-0.8, -0.9, -0.1], type: "negative" },
            "bad": { vec: [-0.7, -0.8, -0.2], type: "negative" },
            "movie": { vec: [0.2, 0.0, 0.1], type: "neutral" },
            "food": { vec: [0.1, 0.1, 0.0], type: "neutral" },
            "not": { vec: [-1.0, -1.0, -1.0], type: "inverter" }, // Special case for logic
            "very": { vec: [0.2, 0.2, 0.2], type: "amplifier" },
            "good": { vec: [0.7, 0.8, 0.1], type: "positive" }
        };

        // Tanh activation function
        const tanh = (x) => (Math.exp(2*x) - 1) / (Math.exp(2*x) + 1);

        // --- Main Component ---

        function App() {
            const [sentence, setSentence] = useState("i love this movie");
            const [words, setWords] = useState(["i", "love", "this", "movie"]);
            
            const [currentStep, setCurrentStep] = useState(-1); // -1: Idle, 0+: Processing index
            const [isPlaying, setIsPlaying] = useState(false);
            
            // RNN State
            const [hiddenState, setHiddenState] = useState([0, 0, 0]); // H_t
            const [history, setHistory] = useState([]); // To show unrolled view
            
            // Math display state
            const [mathDetails, setMathDetails] = useState(null);

            // Helper to parse input
            const handleInput = (e) => {
                setSentence(e.target.value);
                const w = e.target.value.toLowerCase().split(" ").filter(x => x);
                setWords(w);
                reset();
            };

            const reset = () => {
                setCurrentStep(-1);
                setHiddenState([0,0,0]);
                setHistory([]);
                setIsPlaying(false);
                setMathDetails(null);
            };

            const stepForward = () => {
                if (currentStep >= words.length - 1) {
                    setIsPlaying(false);
                    return;
                }

                const nextStep = currentStep + 1;
                setCurrentStep(nextStep);

                const word = words[nextStep];
                // Get vector or default random if unknown
                const inputVec = VOCAB[word]?.vec || [Math.random()-0.5, Math.random()-0.5, Math.random()-0.5];
                
                // RNN Logic: h_t = tanh(h_t-1 + x_t) 
                // (Simplified: simple addition + tanh for visual clarity, real RNN has Weights W_hh and W_xh)
                
                const prevH = currentStep === -1 ? [0,0,0] : hiddenState;
                
                const newH = prevH.map((h, i) => {
                    // Simple "Vanilla RNN" math simulation for demo
                    // We add input to memory and squish it
                    const val = h + inputVec[i]; 
                    return tanh(val); 
                });

                setHiddenState(newH);
                setHistory(prev => [...prev, { 
                    step: nextStep, 
                    word: word, 
                    hidden: newH, 
                    input: inputVec,
                    prevHidden: prevH 
                }]);

                // Update math panel
                setMathDetails({
                    word: word,
                    inputVec: inputVec,
                    prevHidden: prevH,
                    newHidden: newH,
                    equation: `h_t = tanh(h_{t-1} + x_t)`
                });
            };

            useEffect(() => {
                let interval;
                if (isPlaying) {
                    interval = setInterval(stepForward, 1500); // Slow enough to read
                }
                return () => clearInterval(interval);
            }, [isPlaying, currentStep, words]);


            // Color helper based on vector sum (Sentiment proxy)
            const getColor = (vec) => {
                const sum = vec.reduce((a,b) => a+b, 0);
                if (sum > 0.5) return "bg-green-500";
                if (sum < -0.5) return "bg-red-500";
                return "bg-gray-500";
            };

            const getSentimentLabel = (vec) => {
                const sum = vec.reduce((a,b) => a+b, 0);
                if (sum > 0.8) return "Positive";
                if (sum < -0.8) return "Negative";
                return "Neutral";
            }

            return (
                <div className="min-h-screen flex flex-col overflow-hidden bg-black text-gray-200 selection:bg-purple-500/30">
                    
                    {/* Header */}
                    <header className="border-b border-gray-800 bg-gray-900/50 p-4 flex justify-between items-center z-20">
                        <div className="flex items-center gap-3">
                            <div className="p-2 bg-purple-600/20 border border-purple-500/30 rounded-lg text-purple-400">
                                <Icon name="zap" />
                            </div>
                            <h1 className="font-bold text-xl tracking-tight text-white">RNN Visualizer <span className="text-xs font-mono text-gray-500 ml-2 font-normal">Recurrent Neural Network</span></h1>
                        </div>
                        <div className="text-xs font-mono text-gray-500 hidden md:block">
                            Goal: Sentiment Analysis
                        </div>
                    </header>

                    <main className="flex-1 flex flex-col lg:flex-row overflow-hidden">
                        
                        {/* Left Panel: Input & Timeline */}
                        <div className="w-full lg:w-80 bg-gray-900/30 border-r border-gray-800 p-6 flex flex-col gap-6 z-10 overflow-y-auto">
                            
                            {/* Controls */}
                            <div className="glass-panel p-4 rounded-xl">
                                <label className="text-xs font-bold text-gray-400 uppercase mb-2 block">Input Sentence</label>
                                <input 
                                    value={sentence}
                                    onChange={handleInput}
                                    className="w-full bg-black/50 border border-gray-700 rounded px-3 py-2 text-sm text-white focus:ring-1 focus:ring-purple-500 outline-none mb-4"
                                    placeholder="Type here..."
                                />
                                
                                <div className="flex gap-2">
                                    <button onClick={() => setIsPlaying(!isPlaying)} className="flex-1 bg-purple-600 hover:bg-purple-500 text-white py-2 rounded-lg flex justify-center items-center gap-2 transition-colors">
                                        {isPlaying ? <Icon name="pause" size={16} /> : <Icon name="play" size={16} />}
                                        {isPlaying ? "Pause" : "Process"}
                                    </button>
                                    <button onClick={stepForward} className="px-4 bg-gray-800 hover:bg-gray-700 rounded-lg border border-gray-700 text-gray-300">
                                        <Icon name="step" size={16} />
                                    </button>
                                    <button onClick={reset} className="px-4 bg-gray-800 hover:bg-gray-700 rounded-lg border border-gray-700 text-gray-300">
                                        <Icon name="refresh" size={16} />
                                    </button>
                                </div>
                            </div>

                            {/* Unrolled History View */}
                            <div className="flex-1">
                                <h3 className="text-xs font-bold text-gray-500 uppercase mb-3">Unrolled History</h3>
                                <div className="space-y-4 relative">
                                    {/* Line connector */}
                                    <div className="absolute left-4 top-2 bottom-0 w-0.5 bg-gray-800 -z-10"></div>

                                    {history.length === 0 && <div className="text-gray-600 text-xs italic text-center py-4">Start processing to see history...</div>}

                                    {history.map((snap, idx) => (
                                        <div key={idx} className="flex items-center gap-4 animate-in fade-in slide-in-from-top-2 duration-500">
                                            <div className={`w-8 h-8 rounded-full shrink-0 flex items-center justify-center text-xs font-bold border-2 border-gray-900 ${getColor(snap.hidden)} text-white shadow-lg`}>
                                                h<sub>{idx+1}</sub>
                                            </div>
                                            <div className="bg-gray-800/50 border border-gray-700 p-2 rounded-lg flex-1">
                                                <div className="flex justify-between text-xs mb-1">
                                                    <span className="text-purple-300 font-bold">"{snap.word}"</span>
                                                    <span className="text-gray-500 font-mono">t={idx+1}</span>
                                                </div>
                                                {/* Mini vector vis */}
                                                <div className="flex gap-0.5 h-1.5 bg-gray-900 rounded overflow-hidden">
                                                    {snap.hidden.map((v, i) => (
                                                        <div key={i} className="h-full bg-purple-500 transition-all" style={{ width: '33%', opacity: (v + 1) / 2 }}></div>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>

                        </div>

                        {/* Center Panel: The "RNN Cell" Animation */}
                        <div className="flex-1 relative flex flex-col">
                            
                            {/* Background Grid */}
                            <div className="absolute inset-0 opacity-10 pointer-events-none" style={{ 
                                backgroundImage: 'linear-gradient(#4c1d95 1px, transparent 1px), linear-gradient(90deg, #4c1d95 1px, transparent 1px)', 
                                backgroundSize: '40px 40px' 
                            }}></div>

                            {/* Main Diagram Area */}
                            <div className="flex-1 flex items-center justify-center relative overflow-hidden p-8">
                                
                                {/* The RNN Cell */}
                                <div className="relative w-96 h-64 glass-panel rounded-2xl shadow-2xl border-purple-500/30 flex flex-col items-center justify-center z-10">
                                    <div className="absolute -top-3 bg-purple-900 text-purple-200 text-xs px-2 py-0.5 rounded border border-purple-700 font-bold">RNN Cell (Time step t)</div>
                                    
                                    {/* Internal Logic Visual */}
                                    <div className="flex items-center gap-6 relative">
                                        
                                        {/* Previous State H_t-1 */}
                                        <div className="flex flex-col items-center gap-2">
                                            <div className="text-[10px] text-gray-400 font-mono">h<sub>t-1</sub></div>
                                            <div className={`w-12 h-12 rounded-lg border border-gray-600 flex items-center justify-center text-xs font-mono bg-gray-800 transition-colors duration-500 ${currentStep >= 0 ? 'shadow-[0_0_15px_rgba(107,114,128,0.3)]' : ''}`}>
                                                {currentStep > 0 ? "Prev" : "0"}
                                            </div>
                                            <div className="h-8 w-0.5 bg-gray-600 relative">
                                                 {currentStep >= 0 && <div className="absolute w-2 h-2 bg-white rounded-full left-1/2 -translate-x-1/2 animate-flow-v" style={{ animationDuration: '2s' }}></div>}
                                            </div>
                                        </div>

                                        {/* Operation Node (The "Brain") */}
                                        <div className="w-16 h-16 rounded-full bg-purple-600 flex items-center justify-center shadow-[0_0_30px_rgba(147,51,234,0.4)] relative z-20">
                                            <span className="font-serif italic font-bold text-white text-xl">tanh</span>
                                        </div>

                                        {/* Input X_t */}
                                        <div className="absolute -bottom-32 left-1/2 -translate-x-1/2 flex flex-col items-center gap-2">
                                            <div className="h-16 w-0.5 bg-blue-500 relative overflow-hidden">
                                                {currentStep >= 0 && <div className="absolute w-full h-1/2 bg-blue-300 animate-flow-v"></div>}
                                            </div>
                                            <div className={`px-4 py-2 rounded border border-blue-500/50 bg-blue-900/30 text-blue-200 font-mono text-sm transition-all duration-500 ${currentStep >= 0 ? 'scale-110 shadow-[0_0_20px_rgba(59,130,246,0.4)]' : 'opacity-50'}`}>
                                                {currentStep >= 0 ? `"${words[currentStep]}"` : "Waiting..."}
                                            </div>
                                            <div className="text-[10px] text-blue-400 font-mono">x<sub>t</sub> (Input)</div>
                                        </div>

                                        {/* New State H_t */}
                                        <div className="flex flex-col items-center gap-2">
                                            <div className="text-[10px] text-green-400 font-mono">h<sub>t</sub></div>
                                            <div className={`w-12 h-12 rounded-lg border border-green-600 flex items-center justify-center text-xs font-mono transition-colors duration-500 ${currentStep >= 0 ? getColor(hiddenState) : 'bg-gray-800'}`}>
                                                New
                                            </div>
                                            <div className="h-8 w-0.5 bg-green-600 relative"></div>
                                        </div>

                                    </div>

                                    {/* Feedback Loop Arrow (Visual Only) */}
                                    <svg className="absolute w-full h-full pointer-events-none" style={{ overflow: 'visible' }}>
                                        {/* Loop from Out back to In (Simulated) */}
                                        <path d="M 260 100 C 320 100, 320 40, 280 40 L 250 40" fill="none" stroke="#4b5563" strokeWidth="1" strokeDasharray="4 4" className="opacity-30" />
                                        <text x="280" y="30" fill="#6b7280" fontSize="10" textAnchor="middle">Memory Loop</text>
                                    </svg>

                                </div>
                                
                                {/* Final Output Display */}
                                <div className="absolute top-8 right-8 glass-panel p-4 rounded-xl text-right border-green-500/20 w-48">
                                    <h3 className="text-xs font-bold text-gray-500 uppercase">Current Sentiment</h3>
                                    <div className={`text-2xl font-bold my-1 smooth-move ${getSentimentLabel(hiddenState) === "Positive" ? "text-green-400" : getSentimentLabel(hiddenState) === "Negative" ? "text-red-400" : "text-gray-400"}`}>
                                        {getSentimentLabel(hiddenState)}
                                    </div>
                                    <div className="w-full bg-gray-700 h-1 rounded-full overflow-hidden">
                                        {/* Visualize the average activation state */}
                                        <div className="h-full bg-white transition-all duration-500" style={{ 
                                            width: '10px', 
                                            marginLeft: `${(hiddenState.reduce((a,b)=>a+b,0)/3 + 1)/2 * 100}%` 
                                        }}></div>
                                    </div>
                                    <div className="flex justify-between text-[9px] text-gray-500 mt-1">
                                        <span>Neg</span>
                                        <span>Pos</span>
                                    </div>
                                </div>

                            </div>

                            {/* Bottom Panel: Glass Box Math */}
                            {mathDetails && (
                                <div className="h-48 bg-gray-900 border-t border-gray-800 p-6 flex gap-8 animate-in slide-in-from-bottom-4">
                                    
                                    <div className="w-1/3 border-r border-gray-800 pr-6">
                                        <h3 className="text-sm font-bold text-white mb-2 flex items-center gap-2">
                                            <span className="w-2 h-2 rounded-full bg-purple-500"></span>
                                            Step Calculation
                                        </h3>
                                        <div className="font-mono text-xs text-gray-400 space-y-2">
                                            <div className="flex justify-between">
                                                <span>Current Input:</span>
                                                <span className="text-blue-400">[{mathDetails.inputVec.map(n=>n.toFixed(1)).join(', ')}]</span>
                                            </div>
                                            <div className="flex justify-between">
                                                <span>Previous Memory:</span>
                                                <span className="text-gray-400">[{mathDetails.prevHidden.map(n=>n.toFixed(1)).join(', ')}]</span>
                                            </div>
                                            <div className="border-t border-gray-700 pt-1 mt-1 flex justify-between font-bold">
                                                <span>New Memory:</span>
                                                <span className="text-green-400">[{mathDetails.newHidden.map(n=>n.toFixed(1)).join(', ')}]</span>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="flex-1">
                                        <h3 className="text-sm font-bold text-white mb-2">What happened?</h3>
                                        <p className="text-sm text-gray-300 leading-relaxed">
                                            The RNN took the word <span className="text-blue-300 font-bold">"{mathDetails.word}"</span>. 
                                            It combined its meaning with the <span className="text-gray-400 font-bold">Previous Memory</span>. 
                                            {VOCAB[mathDetails.word]?.type === 'inverter' 
                                                ? " This word is a logical flipper, drastically changing the state!" 
                                                : VOCAB[mathDetails.word]?.type === 'positive' 
                                                ? " This word added positive values to the state vector."
                                                : VOCAB[mathDetails.word]?.type === 'negative'
                                                ? " This word pushed the values into negative territory."
                                                : " This word updated the context slightly without a major polarity shift."
                                            }
                                        </p>
                                        <div className="mt-2 bg-black/30 p-2 rounded font-mono text-xs text-purple-300">
                                            {mathDetails.equation}
                                        </div>
                                    </div>

                                </div>
                            )}
                            
                            {!mathDetails && (
                                <div className="h-48 bg-gray-900 border-t border-gray-800 p-6 flex items-center justify-center text-gray-600 italic text-sm">
                                    Press Process to see the math internals...
                                </div>
                            )}

                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
