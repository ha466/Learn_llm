<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Lab: Master Index</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body { 
            font-family: 'Space Grotesk', sans-serif; 
            background-color: #050505; 
            color: #e4e4e7; 
            overflow-x: hidden;
        }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        
        /* Matrix-like subtle grid */
        .bg-grid {
            background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        /* Neon Glows */
        .glow-text { text-shadow: 0 0 10px rgba(255,255,255,0.3); }
        
        /* Animations */
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }
        .animate-float { animation: float 4s ease-in-out infinite; }

        /* Loading text styling */
        #root:empty:before {
            content: "Initializing Neural Lab...";
            color: #6b7280;
            font-family: monospace;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body class="bg-grid min-h-screen">

    <!-- App Mount Point -->
    <div id="root"></div>

    <!-- Error Handler Script -->
    <script>
        window.onerror = function(message, source, lineno, colno, error) {
            document.body.innerHTML = `<div style="color:red; padding:20px; font-family:monospace;">
                <h2>System Failure</h2>
                <p>${message}</p>
                <p>Line: ${lineno}</p>
            </div>`;
        };
    </script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Configuration ---
        const BASE_URL = "https://ha466.github.io/Learn_llm/";

        // --- Icons Component (Fixed Grouping) ---
        const Icon = ({ name, className }) => {
            const icons = {
                brain: <path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2Z M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.98-3A2.5 2.5 0 0 0 14.5 2Z" />,
                eye: <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z" />,
                zap: <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />,
                flask: <g><path d="M10 2v7.31" /><path d="M14 2v7.31" /><path d="M8.5 2h7" /><path d="M14 9.3a6.5 6.5 0 1 1-4 0" /></g>,
                clock: <g><circle cx="12" cy="12" r="10" /><polyline points="12 6 12 12 16 14" /></g>,
                external: <g><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" /><polyline points="15 3 21 3 21 9" /><line x1="10" y1="14" x2="21" y2="3" /></g>
            };
            return (
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {icons[name] || icons.brain}
                </svg>
            );
        };

        // --- Roadmap Data ---
        const ROADMAP_DATA = [
            { 
                year: "1958", 
                era: "The Perceptron", 
                desc: "Frank Rosenblatt invents the Perceptron. It's basically a single neuron that can distinguish squares from circles... sometimes.", 
                joke: "Expectation: Skynet. Reality: Can't define 'XOR'.",
                color: "text-gray-500",
                dotColor: "bg-gray-500"
            },
            { 
                year: "1980s", 
                era: "The Winter & MLP", 
                desc: "Multi-Layer Perceptrons (MLP) arrive. We figured out we can stack neurons! Backpropagation makes training actually possible.", 
                joke: "Computers were too slow, so we just wrote sci-fi novels instead.",
                color: "text-blue-400",
                dotColor: "bg-blue-400"
            },
            { 
                year: "1998", 
                era: "LeNet (CNNs)", 
                desc: "Yann LeCun teaches computers to read handwriting. Convolutional Neural Networks (CNNs) are born. They look at pixels like sliding windows.", 
                joke: "The Post Office was thrilled. Cats on the internet were next.",
                color: "text-cyan-400",
                dotColor: "bg-cyan-400"
            },
            { 
                year: "2000s", 
                era: "RNNs & LSTMs", 
                desc: "Recurrent Neural Networks give AI a 'memory'. Now they can read sentences, not just words. But they forget things quickly.", 
                joke: "Like a goldfish with a notepad.",
                color: "text-purple-400",
                dotColor: "bg-purple-400"
            },
            { 
                year: "2017", 
                era: "The Transformer", 
                desc: "'Attention Is All You Need' paper drops. Google researchers realize you don't need recurrence, just massive parallel attention.", 
                joke: "RIP RNNs. You will be mi— oh look, a GPT!",
                color: "text-yellow-400",
                dotColor: "bg-yellow-400"
            },
            { 
                year: "Now", 
                era: "LLM Era", 
                desc: "GPT-4, Gemini, Claude. Models with trillions of parameters. They can code, write poetry, and hallucinate facts confidentally.", 
                joke: "I am currently writing this code. Or am I?",
                color: "text-green-400",
                dotColor: "bg-green-400"
            }
        ];

        // --- Project Links ---
        const PROJECTS = [
            {
                title: "Basic CNN",
                url: BASE_URL + "Basic_cnn.html",
                type: "Vision",
                icon: "eye",
                color: "blue",
                borderColor: "border-blue-500",
                bgHover: "hover:border-blue-500",
                badgeColor: "text-blue-300 bg-blue-900/30 border-blue-500/30",
                iconColor: "text-blue-400 bg-blue-900/20",
                desc: "The classic filter slider. See how edges are detected."
            },
            {
                title: "Advanced CNN",
                url: BASE_URL + "Advcnn.html",
                type: "Vision",
                icon: "eye",
                color: "cyan",
                borderColor: "border-cyan-500",
                bgHover: "hover:border-cyan-500",
                badgeColor: "text-cyan-300 bg-cyan-900/30 border-cyan-500/30",
                iconColor: "text-cyan-400 bg-cyan-900/20",
                desc: "Glass-box interaction. Draw numbers and watch the math happen."
            },
            {
                title: "Basic RNN",
                url: BASE_URL + "basic_RNN.html",
                type: "Memory",
                icon: "zap",
                color: "purple",
                borderColor: "border-purple-500",
                bgHover: "hover:border-purple-500",
                badgeColor: "text-purple-300 bg-purple-900/30 border-purple-500/30",
                iconColor: "text-purple-400 bg-purple-900/20",
                desc: "A neural network that remembers. Watch vectors loop back."
            },
            {
                title: "Advanced RNN",
                url: BASE_URL + "Adv.RNN.html",
                type: "Memory",
                icon: "flask",
                color: "fuchsia",
                borderColor: "border-fuchsia-500",
                bgHover: "hover:border-fuchsia-500",
                badgeColor: "text-fuchsia-300 bg-fuchsia-900/30 border-fuchsia-500/30",
                iconColor: "text-fuchsia-400 bg-fuchsia-900/20",
                desc: "Lab grade visualization. Inspect the weights and matrices."
            },
            {
                title: "Basic GPT / LLM",
                url: BASE_URL + "Basic_gpt.html",
                type: "Language",
                icon: "brain",
                color: "green",
                borderColor: "border-green-500",
                bgHover: "hover:border-green-500",
                badgeColor: "text-green-300 bg-green-900/30 border-green-500/30",
                iconColor: "text-green-400 bg-green-900/20",
                desc: "The Transformer architecture. Attention heads and tokens explained."
            }
        ];

        function App() {
            return (
                <div className="max-w-6xl mx-auto px-6 py-12">
                    
                    {/* Header */}
                    <header className="text-center mb-24 animate-float">
                        <div className="inline-flex items-center justify-center p-3 rounded-full bg-white/5 border border-white/10 mb-6">
                            <Icon name="brain" className="w-6 h-6 text-purple-400 mr-2" />
                            <span className="text-sm font-mono text-purple-200">NEURAL_ARCHIVE_V1.0</span>
                        </div>
                        <h1 className="text-5xl md:text-7xl font-bold mb-4 bg-clip-text text-transparent bg-gradient-to-r from-purple-400 via-blue-400 to-green-400 glow-text">
                            The Neural Lab
                        </h1>
                        <p className="text-xl text-gray-400 max-w-2xl mx-auto">
                            From simple pixels to existential crises. A visual journey through Artificial Intelligence.
                        </p>
                    </header>

                    {/* Section 1: The Lab (Project Index) */}
                    <section className="mb-32">
                        <div className="flex items-end justify-between mb-8 border-b border-gray-800 pb-4">
                            <h2 className="text-3xl font-bold text-white flex items-center gap-3">
                                <Icon name="flask" className="text-green-400" />
                                Experiment Index
                            </h2>
                            <span className="text-sm font-mono text-gray-500 hidden md:block">HOST: GITHUB PAGES</span>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            {PROJECTS.map((proj, i) => (
                                <a 
                                    key={i} 
                                    href={proj.url}
                                    className={`group relative p-6 rounded-2xl bg-[#0a0a0c] border border-gray-800 transition-all duration-300 hover:-translate-y-2 hover:shadow-2xl ${proj.bgHover}`}
                                >
                                    {/* Badge */}
                                    <div className={`absolute top-4 right-4 text-[10px] font-bold px-2 py-1 rounded border uppercase tracking-widest ${proj.badgeColor}`}>
                                        {proj.type}
                                    </div>

                                    <div className={`w-12 h-12 rounded-xl flex items-center justify-center mb-4 group-hover:scale-110 transition-transform ${proj.iconColor}`}>
                                        <Icon name={proj.icon} />
                                    </div>
                                    
                                    <h3 className="text-xl font-bold text-white mb-2 group-hover:text-white">{proj.title}</h3>
                                    <p className="text-sm text-gray-400 mb-4">{proj.desc}</p>
                                    
                                    <div className="flex items-center text-xs font-mono text-gray-500 group-hover:text-white transition-colors bg-black/30 p-2 rounded border border-gray-800">
                                        <span className="truncate mr-2">{proj.url.split('/').pop()}</span>
                                        <Icon name="external" className="w-3 h-3 ml-auto" />
                                    </div>
                                </a>
                            ))}
                        </div>
                    </section>

                    {/* Section 2: The Roadmap (History) */}
                    <section>
                        <div className="flex items-center justify-center mb-16">
                            <h2 className="text-3xl font-bold text-white flex items-center gap-3 border-b border-gray-800 pb-2 px-8">
                                <Icon name="clock" className="text-yellow-400" />
                                The Evolution Roadmap
                            </h2>
                        </div>

                        <div className="relative max-w-3xl mx-auto">
                            {/* Center Line */}
                            <div className="absolute left-[20px] md:left-1/2 top-0 bottom-0 w-0.5 bg-gray-800 md:-translate-x-1/2"></div>

                            {ROADMAP_DATA.map((item, i) => {
                                const isLeft = i % 2 === 0;
                                return (
                                    <div key={i} className={`relative flex flex-col md:flex-row items-center mb-16 ${isLeft ? '' : 'md:flex-row-reverse'}`}>
                                        
                                        {/* Dot */}
                                        <div className={`absolute left-[20px] md:left-1/2 w-4 h-4 rounded-full border-2 border-[#050505] shadow-[0_0_10px_rgba(255,255,255,0.5)] z-10 md:-translate-x-1/2 ${item.dotColor}`}></div>

                                        {/* Content Card */}
                                        <div className={`ml-12 md:ml-0 w-full md:w-[45%] p-6 rounded-xl bg-[#0f0f11] border border-gray-800 hover:border-gray-600 transition-colors`}>
                                            <div className={`text-3xl font-bold mb-1 ${item.color} opacity-20 absolute top-4 right-6`}>{item.year}</div>
                                            <h3 className={`text-xl font-bold text-white mb-2`}>{item.era}</h3>
                                            <p className="text-sm text-gray-400 leading-relaxed mb-3">
                                                {item.desc}
                                            </p>
                                            <div className="text-xs font-mono text-gray-500 border-t border-gray-800 pt-2 italic">
                                                "{item.joke}"
                                            </div>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </section>

                    {/* Footer */}
                    <footer className="mt-32 text-center border-t border-gray-900 pt-12 pb-12">
                        <p className="text-gray-600 font-mono text-sm">
                            &copy; 2025 Neural Lab Inc. No GPUs were harmed in the making of this HTML.
                        </p>
                    </footer>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
